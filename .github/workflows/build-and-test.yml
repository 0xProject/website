name: build and test

on: [push]

jobs:
    install-dependencies:
        runs-on: ubuntu-latest
        env:
            CI: true
        steps:
            - uses: actions/checkout@v6
            - run: git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
            - name: Setup node 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 9.15.0
            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
            - uses: actions/cache@v5
              name: Setup pnpm cache
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@v5
              id: cache-deps
              with:
                  path: '.'
                  key: ${{ github.sha }}-deps
    lint:
        runs-on: ubuntu-latest
        needs: install-dependencies
        steps:
            - uses: actions/cache@v5
              id: restore-deps
              with:
                  path: '.'
                  key: ${{ github.sha }}-deps
            - name: Setup node 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 9.15.0
            - run: pnpm lint
    unit-test:
        runs-on: ubuntu-latest
        needs: install-dependencies
        steps:
            - uses: actions/cache@v5
              id: restore-deps
              with:
                  path: '.'
                  key: ${{ github.sha }}-deps
            - name: Setup node 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24.x
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 9.15.0
            - run: pnpm test
    build:
        runs-on: ubuntu-latest
        needs: install-dependencies
        strategy:
            matrix:
                node-version: [24.x]
        steps:
            - uses: actions/cache@v5
              id: restore-deps
              with:
                  path: '.'
                  key: ${{ github.sha }}
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 9.15.0
            - run: pnpm build:prod
            - uses: actions/cache@v5
              id: cache-build
              with:
                  path: '.'
                  key: ${{ github.sha }}-build
